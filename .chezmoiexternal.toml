# Oh My Zsh
[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"

# TPM (Tmux Plugin Manager)
[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm"
    refreshPeriod = "168h"

# Theme.sh
["bin/theme.sh"]
    type = "git-repo"
    url = "https://github.com/lemnos/theme.sh.git"
    refreshPeriod = "168h"

# ZSH Syntax Highlighting
[".zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

# Oh My Posh
["bin/oh-my-posh"]
    type = "file"
    url = "https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest/download/posh-linux-amd64"
    executable = true
    refreshPeriod = "168h"

# Fastfetch
["bin/fastfetch"]
    type = "archive-file"
    url = "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.tar.gz"
    path = "fastfetch-linux-amd64/usr/bin/fastfetch"
    executable = true
    refreshPeriod = "168h"
