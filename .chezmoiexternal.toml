# Oh My Zsh (downloading the tarball is faster than cloning)
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h" # Automatically update once a week

# TPM (Tmux Plugin Manager)
[".tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm"
    refreshPeriod = "168h"

# Theme.sh
["bin/theme.sh"]
    type = "git-repo"
    url = "https://github.com/lemnos/theme.sh.git"
    refreshPeriod = "168h"

# ZSH Syntax Highlighting
[".zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

# Oh My Posh
["bin/oh-my-posh"]
    type = "file"
    url = "https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest/download/posh-linux-amd64"
    executable = true
    refreshPeriod = "168h"
